apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecommerce-apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: ecommerce
  source:
    repoURL: https://github.com/noman-akram29/ecommerce-platform-gitops.git
    targetRevision: main
    path: environments/kubeadm/staging/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
  ignoreDifferences: # optional, only if you later use HPA that mutates replicas
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
