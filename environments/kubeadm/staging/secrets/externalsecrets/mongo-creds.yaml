# MongoDB credentials
# Root is used only by the MongoDB StatefulSet for bootstrap.
# product-service connects as the dedicated product_app user (see product-mongo-uri).
apiVersion: v1
kind: Secret
metadata:
  name: mongo-creds
  namespace: ecommerce
  labels:
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/component: database
type: Opaque
stringData:
  password: "mongodb123"